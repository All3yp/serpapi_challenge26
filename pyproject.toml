[project]
name = "serpapi-challenge26"
version = "0.1.0"
description = "Gap Finder — a research-gap finder built on SerpApi (Google Scholar)"
readme = "README.md"
authors = [
    { name = "Alley", email = "29764688+All3yp@users.noreply.github.com" }
]
requires-python = ">=3.14"
dependencies = [
    "serpapi>=1.1.0",
    "streamlit>=1.40",
]

[project.scripts]
gap-finder = "serpapi_challenge26:main"

[dependency-groups]
dev = [
    "babel>=2.18.0",
    "pytest>=8.0",
    "pytest-cov>=7.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/serpapi_challenge26"]

[tool.pytest.ini_options]
testpaths = ["tests"]
